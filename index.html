<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ladder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap">
<style>
:root{--bg:#0b0f14;--card:#121922;--line:#1f2a36;--tx:#e8edf2;--mut:#8b99a8;--red:#ff4d5a;--blue:#4db8ff;--ok:#3ddc97}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Barlow',system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;margin:0;letter-spacing:.02em;line-height:1.1}
h1{font-size:30px}h2{font-size:34px}h3{font-size:22px}
header{position:sticky;top:0;z-index:5;background:rgba(11,15,20,.94);border-bottom:1px solid var(--line)}
.in{max-width:1000px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
main{max-width:1000px;margin:0 auto;padding:24px 20px 56px;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;min-height:38px;padding:0 16px;color:var(--mut);border-radius:9px}
.tabs button.on{background:var(--red);color:#0b0f14;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;width:100%}
button{font:inherit;cursor:pointer;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid #33414f;background:transparent;color:var(--tx);transition:background .15s,border-color .15s}
button:hover{border-color:#52657a;background:#18222d}
button.p{background:var(--red);border-color:var(--red);color:#0b0f14;font-weight:500}button.p:hover{filter:brightness(1.1)}
button.s{min-height:30px;padding:0 10px;font-size:13px}
button:focus-visible,input:focus-visible{outline:2px solid #ff8a93;outline-offset:2px}
input{font:inherit;background:#0b0f14;border:1px solid #33414f;border-radius:10px;color:var(--tx);padding:0 14px;min-height:46px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.mut{color:var(--mut)}.sm{font-size:13px}
.big{font:700 52px/1 'Barlow Condensed',sans-serif;color:var(--red)}
.clock{font:700 76px/1 'Barlow Condensed',sans-serif;color:var(--red);font-variant-numeric:tabular-nums}
.bar{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);width:100%;transition:width 1s linear}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;width:100%}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}.tile.ok{border-color:var(--ok)}
.av{width:36px;height:36px;border-radius:50%;background:#1d2a38;display:grid;place-items:center;font:700 17px 'Barlow Condensed';flex:none}
.chip{font-size:12px;border:1px solid #33414f;border-radius:999px;padding:1px 10px;color:var(--mut);align-self:flex-start}.chip.ok{color:var(--ok);border-color:var(--ok)}
.chat{width:100%;max-height:220px;overflow:auto;background:#0b0f14;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}.sys{color:#ff8a93}
.lb{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 14px;border-radius:10px;background:#0b0f14;gap:10px}.lb.me{background:#2a1a20;color:#ff8a93}
.rk{font:700 22px 'Barlow Condensed';width:34px;color:var(--mut)}.t1 .rk{color:#ffd24d}.t2 .rk{color:#c9d4df}.t3 .rk{color:#d99a6c}
.warn{background:#2a1a20;border:1px solid #5a2a33;border-radius:10px;padding:10px 14px;color:#ff8a93}
img{max-width:100%;max-height:240px;border-radius:10px}
@media(max-width:560px){.clock{font-size:60px}h2{font-size:28px}}
</style></head><body><header id="hd"></header><main id="app"></main>
<script>
let S, tab = 'play', mode = 'login', me = localStorage.me || '', tk = localStorage.tk || '', f = { w: '13', l: '', shot: '', proof: '', name: '', pass: '', msg: '', tmsg: '', code: '' }, shots = {}, last = '', off = 0, wasIn = false, missed = false;
const H = document.getElementById('hd'), A = document.getElementById('app'), id = () => me.toLowerCase();
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nm = i => esc(S.players[i] ? S.players[i].name : i), now = () => Date.now() + off;
const fmt = ms => { ms = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(ms / 60)).padStart(2, '0') + ':' + String(ms % 60).padStart(2, '0'); };
const av = k => `<div class="av">${esc((S.players[k] ? S.players[k].name : '?')[0].toUpperCase())}</div>`;
const isMod = () => S.players[id()] && S.players[id()].role === 'mod';
async function act(o) {
  if (o.type === 'join') missed = false;
  const j = await (await fetch('/api/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ me: id(), token: tk, ...o }) })).json();
  if (!j.ok) { alert(j.err); if (/sign in/.test(j.err)) { tk = ''; localStorage.tk = ''; } }
  else if (j.token) { tk = j.token; localStorage.tk = tk; me = o.name; localStorage.me = me; }
  else if (o.type === 'submit') f.w = '13', f.l = '', f.shot = '';
  else if (o.type === 'say') f.msg = '';
  else if (o.type === 'tsay') f.tmsg = '';
  else if (o.type === 'announce') f.code = '';
  load(true);
}
async function load(force) {
  try { const j = await (await fetch('/api/state?me=' + encodeURIComponent(id()) + '&token=' + tk)).json(); if (!j.players) throw new Error('bad response'); S = j; }
  catch (e) { if (!S) A.innerHTML = '<div class="card"><h2>Cannot reach the server</h2><div class="mut">The page loaded, but the server did not answer. Refresh in a minute. If it keeps happening, the site owner should check the Vercel function logs and the database connection.</div></div>'; return; }
  off = S.now - Date.now();
  const { now: _n, ...rest } = S, k = JSON.stringify(rest) + tab + me + tk + mode;
  if (force || k !== last) { last = k; render(); }
}
const go = t => { tab = t; render(); };
const out = () => { tk = ''; localStorage.tk = ''; render(); };
function pick(key) { return e => { const file = e.target.files[0]; if (!file) return;
  const im = new Image(); im.onload = () => { const k = Math.min(1, 900 / im.width), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k;
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); f[key] = c.toDataURL('image/jpeg', .6); render(); }; im.src = URL.createObjectURL(file); }; }
async function need(key, url) { if (!shots[key]) { shots[key] = 'loading'; const j = await (await fetch(url + '&me=' + encodeURIComponent(id()) + '&token=' + tk)).json(); shots[key] = j.shot || ' '; render(); } }
const del = (m, x) => isMod() && x.i ? ` <button class="s" onclick="act({type:'delmsg',matchId:'${m.id}',msgId:'${x.i}'})">Delete</button>` : '';
const line = (m, x) => x.sys ? `<div class="sys"><b>${esc(x.t)}</b>${del(m, x)}</div>` : `<div><b>${esc(x.from)}</b> ${esc(x.t)}${del(m, x)}</div>`;
const inp = (k, ph, type) => `<input id="${k}" type="${type || 'text'}" placeholder="${ph}" value="${esc(f[k])}" oninput="f.${k}=this.value" aria-label="${ph}">`;
const timer = (title, note, until, total) => `<div class="card"><h3>${title}</h3><div class="clock" data-until="${until}" data-total="${total}"></div><div class="bar"><i></i></div><div class="mut">${note}</div></div>`;
function tickUI() {
  document.querySelectorAll('[data-until]').forEach(el => {
    const left = +el.dataset.until - now(); el.textContent = fmt(left);
    const bar = el.parentNode.querySelector('.bar i'); if (bar) bar.style.width = Math.max(0, Math.min(100, left / +el.dataset.total * 100)) + '%';
    if (left <= -800 && !el.dataset.done) { el.dataset.done = 1; load(true); }
  });
}
function auth() {
  const c = mode === 'create';
  return `<div class="card"><h2>${c ? 'Create account' : 'Sign in'}</h2>${inp('name', 'Riot ID (Name#TAG)')}${inp('pass', 'Password', 'password')}` +
    (c ? `<div class="mut">Upload a screenshot of your Valorant profile showing this Riot ID. Our team checks it before you can play.</div><input type="file" accept="image/*" onchange="pick('proof')(event)" aria-label="Profile screenshot">${f.proof ? `<img src="${f.proof}" alt="Profile preview">` : ''}` : '') +
    `<div class="row"><button class="p" onclick="act({type:'${c ? 'register' : 'login'}',name:f.name.trim(),password:f.pass,proof:f.proof})">${c ? 'Create account' : 'Sign in'}</button><button onclick="mode='${c ? 'login' : 'create'}';render()">${c ? 'I have an account' : 'Create account'}</button></div></div>`;
}
function checkView(c) {
  const mine = c.ready.includes(id());
  return timer('Match found: ready up', `${c.ready.length} / ${c.players.length} ready. Anyone not ready when time runs out is removed, and the queue reopens for everyone who is.`, c.deadline, S.readyMs) +
    `<div class="tiles">${c.players.map(k => { const r = c.ready.includes(k); return `<div class="tile ${r ? 'ok' : ''}"><div class="row" style="flex-wrap:nowrap">${av(k)}<div><b>${nm(k)}</b><div class="mut sm">${S.players[k].elo} Elo</div></div></div><span class="chip ${r ? 'ok' : ''}">${r ? 'Ready' : 'Waiting'}</span>${k === id() && !mine ? `<button class="p" onclick="act({type:'ready',checkId:'${c.id}'})">Ready</button>` : ''}</div>`; }).join('')}</div>`;
}
const sideTxt = m => m.sideB ? `Team B ${m.sideB}, Team A ${m.sideB === 'attack' ? 'defense' : 'attack'}` : '';
const info = m => m.map ? `<div class="card" style="flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><div class="mut sm">Map</div><h2>${esc(m.map)}</h2></div><div class="mut">${sideTxt(m) || 'Side being chosen'}</div></div>` : '';
const ja = o => esc(JSON.stringify(o));
function vetoView(m) {
  const t = m.veto.turn, mine = id() === m[t][0], v = m.veto, mem = m.A.includes(id()) ? 'A' : 'B', tally = m.tally || {};
  const note = mine ? 'Your turn. Ban one map. Your team votes can help you decide. If time runs out, a random map is banned for you.' : mem === t ? 'Your leader is banning. Vote for the map you want banned.' : 'Team ' + t + ' leader is choosing. Vote for the map you would ban.';
  return timer('Map ban: Team ' + t + ' to ban', note + ' Team A bans first, then the teams alternate until one map is left.', v.deadline, S.vetoMs) +
    `<div class="tiles">${v.pool.map(x => { const b = v.bans.find(y => y.map === x), n = tally[x] || 0;
      return `<div class="tile ${m.myVote === x && !b ? 'ok' : ''}" style="${b ? 'opacity:.45' : ''}"><b>${esc(x)}</b>${b ? `<span class="chip">Banned by Team ${b.team}</span>` : `<span class="mut sm">${n} vote${n == 1 ? '' : 's'} from your team</span><div class="row"><button class="s" onclick="act(${ja({ type: 'vote', matchId: m.id, map: x })})">${m.myVote === x ? 'Voted' : 'Vote to ban'}</button>${mine ? `<button class="s p" onclick="act(${ja({ type: 'mapban', matchId: m.id, map: x })})">Ban</button>` : ''}</div>`}</div>`; }).join('')}</div>`;
}
function tchatCard(m) {
  const mem = m.A.includes(id()) ? 'A' : 'B', tc = m.tchat || [];
  return `<div class="card" style="border-top:3px solid ${mem === 'A' ? 'var(--red)' : 'var(--blue)'}"><h3>Team ${mem} chat</h3><div class="mut sm">Only your team can see this.</div><div class="chat" id="tlog">${tc.length ? tc.map(x => `<div><b>${esc(x.from)}</b> ${esc(x.t)}</div>`).join('') : '<div class="mut">No messages yet.</div>'}</div><div class="row" style="width:100%">${inp('tmsg', 'Message your team')}<button onclick="act({type:'tsay',matchId:'${m.id}',text:f.tmsg})">Send</button></div></div>`;
}
function sideView(m) {
  const mine = id() === m.B[0];
  return timer('Map: ' + esc(m.map) + '. Team B picks a side', mine ? 'Choose attack or defense. If time runs out, a random side is picked.' : 'The Team B leader is choosing a side.', m.veto.deadline, S.sideMs) +
    (mine ? `<div class="row"><button class="p" onclick="act({type:'pickside',matchId:'${m.id}',side:'attack'})">Attack</button><button class="p" onclick="act({type:'pickside',matchId:'${m.id}',side:'defense'})">Defense</button></div>` : '');
}
const teamCol = (ids, c, l) => `<div class="card" style="border-top:3px solid ${c}"><h3 style="color:${c}">${l}</h3>${ids.map((k, i) => `<div class="row" style="flex-wrap:nowrap">${av(k)}<div><b>${nm(k)}</b>${i == 0 ? ' <span class="chip">Leader</span>' : ''}</div></div>`).join('')}</div>`;
function chat(m) {
  const lead = id() === m.A[0];
  return `<div class="card"><h3>Match chat</h3><div class="chat" id="log">${(m.chat || []).length ? (m.chat || []).map(x => line(m, x)).join('') : '<div class="mut">No messages yet.</div>'}</div>` +
    `<div class="row" style="width:100%">${inp('msg', 'Message')}<button onclick="act({type:'say',matchId:'${m.id}',text:f.msg})">Send</button></div>` +
    (lead && m.status === 'live' && !m.code && (!m.phase || m.phase === 'play') ? `<div class="row" style="width:100%">${inp('code', 'Party code from Valorant')}<button class="p" onclick="act({type:'announce',matchId:'${m.id}',code:f.code})">Announce party code</button></div>` : '') +
    (!m.code ? `<div class="mut sm">${lead ? 'Create the custom game in Valorant, then announce its party code.' : 'The Team A leader will announce the party code here.'}</div>` : '') + `</div>`;
}
function play() {
  const p = S.players[id()];
  if (!tk || !p) return auth();
  if (p.status === 'pending') return `<div class="card"><h2>Waiting for verification</h2><div class="mut">Our team is checking your profile screenshot. Come back soon.</div></div>`;
  if (p.status === 'rejected') return `<div class="card"><h2>Verification failed</h2><div class="mut">Your screenshot did not match this Riot ID. Contact the moderators.</div></div>`;
  if (p.status === 'banned') return `<div class="card"><h2>Account banned</h2><div class="mut">A moderator has banned this account.</div></div>`;
  const c = S.checks.find(x => x.players.includes(id()));
  const m = S.matches.find(x => ['live', 'submitted', 'disputed'].includes(x.status) && [...x.A, ...x.B].includes(id()));
  if (c) { wasIn = true; return checkView(c); }
  if (wasIn) { wasIn = false; if (!m && !S.queue.includes(id())) missed = true; }
  const head = `<div class="card"><div class="row" style="flex-wrap:nowrap">${av(id())}<div><b>${esc(p.name)}</b><div class="mut sm">Rating</div></div></div><div class="big">${p.elo}</div></div>`;
  if (!m) { const q = S.queue.includes(id());
    return head + (missed ? `<div class="warn">You did not ready up in time, so you left the queue. Join again when you are ready.</div>` : '') +
      `<div class="card"><h2>${q ? 'Searching for players' : 'Find a match'}</h2><div class="bar"><i style="width:${S.queue.length / S.min * 100}%;transition:none"></i></div><div class="mut">${S.queue.length} / ${S.min} in queue. When it fills, everyone gets ${S.readyMs / 1000} seconds to ready up.</div>` + (q ? `<button onclick="act({type:'leave'})">Leave queue</button>` : `<button class="p" onclick="act({type:'join'})">Join queue</button>`) + `</div>`; }
  const lead = id() === m.A[0] || id() === m.B[0], ll = m.winner && (m.winner === 'A' ? m.B[0] : m.A[0]), playing = now() < (m.playUntil || 0), ph = m.phase || 'play';
  let st = '';
  if (m.status === 'live' && ph === 'veto') st = vetoView(m);
  else if (m.status === 'live' && ph === 'side') st = sideView(m);
  else if (m.status === 'live' && playing) st = timer('Match in play', 'Results can be reported when the timer ends.', m.playUntil, S.playMs);
  else if (m.status === 'live') st = lead ? `<div class="card"><h3>Report a win for your team</h3><div class="row"><input style="width:80px" type="number" value="${f.w}" oninput="f.w=this.value" aria-label="Your rounds"><span class="mut">to</span><input style="width:80px" type="number" value="${f.l}" oninput="f.l=this.value" aria-label="Their rounds"></div><input type="file" accept="image/*" onchange="pick('shot')(event)" aria-label="Scoreboard screenshot">${f.shot ? `<img src="${f.shot}" alt="Scoreboard preview">` : ''}<button class="p" onclick="act({type:'submit',matchId:'${m.id}',scoreW:+f.w,scoreL:+f.l,shot:f.shot})">Submit result</button></div>` : `<div class="card mut">Waiting for a team leader to report the result.</div>`;
  if (m.status === 'submitted') st = id() === ll ? `<div class="card"><h3>Team ${m.winner} reports ${m.scoreW}-${m.scoreL}</h3><div class="row"><button class="p" onclick="act({type:'confirm',matchId:'${m.id}'})">Confirm result</button><button onclick="act({type:'dispute',matchId:'${m.id}'})">Dispute</button></div></div>` : `<div class="card mut">Waiting for the other leader to confirm.</div>`;
  if (m.status === 'disputed') st = `<div class="card mut">A moderator is reviewing this match.</div>`;
  return head + info(m) + `<div class="g">${teamCol(m.A, 'var(--red)', 'Team A')}${teamCol(m.B, 'var(--blue)', 'Team B')}</div>${st}` + chat(m) + tchatCard(m);
}
function board() {
  const r = Object.entries(S.players).filter(([k, v]) => v.status === 'approved' && !v.bot).sort((a, b) => b[1].elo - a[1].elo);
  return `<div class="card"><h2>Leaderboard</h2>${r.length ? r.map(([k, v], i) => `<div class="lb t${i + 1} ${k === id() ? 'me' : ''}"><span class="row" style="flex-wrap:nowrap"><span class="rk">${i + 1}</span>${av(k)}<b>${esc(v.name)}</b></span><b>${v.elo}</b></div>`).join('') : '<div class="mut">No verified players yet.</div>'}</div>`;
}
function mod() {
  if (f.pool === undefined) f.pool = S.pool.join(', ');
  const P = Object.entries(S.players), pend = P.filter(([k, v]) => v.status === 'pending'), d = S.matches.filter(x => x.status === 'disputed'), live = S.matches.filter(x => ['live', 'submitted'].includes(x.status));
  pend.forEach(([k]) => need('p' + k, '/api/state?proof=' + encodeURIComponent(k))); d.forEach(x => need('m' + x.id, '/api/state?shot=' + x.id));
  const img = k => shots[k] && shots[k].trim() && shots[k] !== 'loading' ? `<img src="${shots[k]}" alt="Screenshot">` : '';
  const box = c => `<div class="card" style="background:#0b0f14">${c}</div>`;
  const bt = (l, o, p) => `<button${p ? ' class="p"' : ''} onclick="act(${esc(JSON.stringify(o))})">${l}</button>`;
  return `<div class="card"><h2>Moderator</h2><h3>Test tools</h3><div class="mut">Join the queue on the Play tab first, then fill the empty spots with test players. Test players ready up on their own.</div><div class="row">${bt('Fill queue with test players', { type: 'fillqueue' }, 1)}${bt('Remove test players', { type: 'clearbots' })}</div><h3>Map pool</h3><div class="row" style="width:100%">${inp('pool', 'Maps, comma separated')}<button class="p" onclick="act({type:'setpool',maps:f.pool.split(',').map(x=>x.trim()).filter(Boolean)})">Save pool</button></div><div class="mut sm">Applies to new matches.</div><h3>Accounts to verify</h3>` +
    (pend.length ? pend.map(([k, v]) => box(`<div>${esc(v.name)}</div>${img('p' + k)}<div class="row">${bt('Approve', { type: 'review', target: k, approve: true }, 1)}${bt('Reject', { type: 'review', target: k, approve: false })}</div>`)).join('') : '<div class="mut">No accounts waiting.</div>') +
    `<h3>Disputed matches</h3>` + (d.length ? d.map(x => box(`<div>Team ${x.winner} reports ${x.scoreW}-${x.scoreL}. Leaders: ${nm(x.A[0])} vs ${nm(x.B[0])}</div>${img('m' + x.id)}<div class="row">${bt('Uphold result', { type: 'resolve', matchId: x.id, uphold: true }, 1)}${bt('Void match', { type: 'resolve', matchId: x.id, uphold: false })}</div>`)).join('') : '<div class="mut">No disputed matches.</div>') +
    `<h3>Open matches</h3>` + (live.length ? live.map(x => box(`<div>${nm(x.A[0])} vs ${nm(x.B[0])} (${x.status}${x.phase && x.phase !== 'play' ? ', ' + x.phase : ''})</div><div class="chat">${x.chat.slice(-5).map(c => line(x, c)).join('') || '<span class="mut">No chat.</span>'}</div><div class="row">${x.status === 'live' && (x.phase || 'play') === 'play' && now() < x.playUntil ? bt('End timer early', { type: 'skiptimer', matchId: x.id }) : ''}${x.status === 'submitted' ? bt('Uphold result', { type: 'resolve', matchId: x.id, uphold: true }, 1) : ''}${bt('Void match', { type: 'voidmatch', matchId: x.id })}</div>`)).join('') : '<div class="mut">No open matches.</div>') +
    `<h3>Players</h3>` + P.filter(([k, v]) => k !== id() && !v.bot).map(([k, v]) => `<div class="lb"><span>${esc(v.name)} <span class="mut sm">${v.role}, ${v.status}</span></span><span class="row">` +
      (v.role === 'mod' ? bt('Remove moderator', { type: 'setrole', target: k, role: 'player' }) : bt('Make moderator', { type: 'setrole', target: k, role: 'mod' }) + (v.status === 'banned' ? bt('Unban', { type: 'ban', target: k, ban: false }) : bt('Ban', { type: 'ban', target: k, ban: true }))) + `</span></div>`).join('') + `</div>`;
}
function render() {
  if (!S) return;
  const ae = document.activeElement, fid = ae && ae.id, pos = ae && ae.selectionStart;
  if (tab === 'mod' && !isMod()) tab = 'play';
  const t = (k, l) => `<button class="${tab === k ? 'on' : ''}" onclick="go('${k}')">${l}</button>`;
  H.innerHTML = `<div class="in"><h1>Ladder <span style="color:var(--red)">/ Valorant</span></h1><div class="row"><div class="tabs">${t('play', 'Play')}${t('board', 'Leaderboard')}${isMod() ? t('mod', 'Moderator') : ''}</div>${tk ? '<button onclick="out()">Sign out</button>' : ''}</div></div>`;
  A.innerHTML = ({ play, board, mod }[tab])();
  const el = fid && document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
  ['log', 'tlog'].forEach(k => { const lg = document.getElementById(k); if (lg) lg.scrollTop = lg.scrollHeight; });
  tickUI();
}
load(true); setInterval(() => { if (!document.hidden) load(); }, 4000); setInterval(tickUI, 1000);
</script></body></html>
